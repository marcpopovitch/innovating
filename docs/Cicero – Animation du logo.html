<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cicero – Animation du logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F8F7F4;
  --ink: #3A3D41;
  --dot: #D91B4B;
  --muted: #6B6F76;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #F8F7F4; }
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  display: grid;
  place-items: center;
  font-family: Inter, system-ui, sans-serif;
  color: var(--ink);
}
.stage { text-align: center; padding: 24px; }

.word {
  font-family: Newsreader, Georgia, "Times New Roman", serif;
  font-weight: 500;
  font-size: clamp(72px, 16vw, 200px);
  letter-spacing: -0.03em;
  line-height: 1;
  margin: 0;
  display: inline-flex;
  color: var(--ink);
}
/* masque : chaque lettre monte depuis sa ligne de base */
.l { display: inline-block; overflow: hidden; padding: 0.08em 0.01em 0.12em; margin: -0.08em -0.01em -0.12em; }
.l > span { display: inline-block; transform: translateY(110%); }
.i { position: relative; }
.dot {
  position: absolute;
  left: 50%;
  top: 0.105em;
  width: 0.15em; height: 0.15em;
  margin-left: -0.075em;
  border-radius: 50%;
  background: var(--dot);
  opacity: 0;
  transform: translateY(-1.6em) scale(.7);
}
.ring {
  position: absolute; left: 50%; top: 0.105em;
  width: 0.15em; height: 0.15em; margin-left: -0.075em;
  border-radius: 50%;
  border: 2px solid var(--dot);
  opacity: 0; pointer-events: none;
}
.tag {
  margin: clamp(14px, 2.4vw, 28px) 0 0;
  font-size: clamp(11px, 1.9vw, 20px);
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.22em;
  text-transform: uppercase;
  opacity: 0;
}
.replay {
  margin-top: 56px;
  font: inherit; font-size: 14px;
  color: var(--muted);
  background: none; border: 1px solid #D9D7D1; border-radius: 999px;
  padding: 10px 18px; cursor: pointer;
  transition: border-color .2s, color .2s;
}
.replay:hover { color: var(--ink); border-color: var(--ink); }
.replay:focus-visible { outline: 2px solid var(--dot); outline-offset: 3px; }

/* --- Séquence unique (≈ 3 s) --- */
.play .l > span { animation: rise .9s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(var(--n) * 90ms + 150ms); }
.play .dot { animation: drop .75s cubic-bezier(.3,0,.3,1) forwards; animation-delay: 1.25s; }
.play .ring { animation: ripple .8s ease-out forwards; animation-delay: 1.85s; }
.play .tag { animation: tag 1s ease-out forwards; animation-delay: 2.1s; }

@keyframes rise { to { transform: translateY(0); } }
@keyframes drop {
  0%   { opacity: 0; transform: translateY(-1.6em) scale(.7); }
  15%  { opacity: 1; }
  60%  { transform: translateY(0) scale(1); }
  75%  { transform: translateY(-.12em) scale(1); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes ripple {
  0%   { opacity: .55; transform: scale(1); }
  100% { opacity: 0;   transform: scale(5); }
}
@keyframes tag {
  from { opacity: 0; letter-spacing: 0.5em; }
  to   { opacity: 1; letter-spacing: 0.22em; }
}

@media (prefers-reduced-motion: reduce) {
  .l > span, .dot, .tag { animation: none !important; transform: none !important; opacity: 1 !important; }
  .ring { display: none; }
}
</style>
</head>
<body>
<main class="stage" id="stage">
  <h1 class="word" aria-label="Cicero">
    <span class="l" aria-hidden="true"><span style="--n:0">C</span></span>
    <span class="l i" aria-hidden="true"><span style="--n:1">ı</span><i class="dot"></i><i class="ring"></i></span>
    <span class="l" aria-hidden="true"><span style="--n:2">c</span></span>
    <span class="l" aria-hidden="true"><span style="--n:3">e</span></span>
    <span class="l" aria-hidden="true"><span style="--n:4">r</span></span>
    <span class="l" aria-hidden="true"><span style="--n:5">o</span></span>
  </h1>
  <p class="tag">La clarté du droit, la force de la technologie.</p>
  <div><button class="replay" id="replay" type="button">Rejouer l’animation</button></div>
</main>
<script>
(function () {
  var stage = document.getElementById('stage');
  function play() {
    stage.classList.remove('play');
    void stage.offsetWidth;
    stage.classList.add('play');
  }
  document.getElementById('replay').addEventListener('click', play);
  document.addEventListener('keydown', function (e) { if (e.key === 'r' || e.key === 'R') play(); });
  play();
})();
</script>
</body>
</html>
